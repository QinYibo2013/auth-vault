<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>验证码保险箱</title><link rel="stylesheet" href="style.css"></head><body><main><section id="gate"><form id="unlockForm"><input id="password" aria-label="密码" placeholder="密码" type="password" autocomplete="current-password" required maxlength="1024"><button id="unlockBtn">确定</button></form><p id="gateError" role="alert"></p></section><section id="vault" hidden>
<header class="app-header">
<details id="vaultMenu"><summary aria-label="菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></summary><div class="menu-items"><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><button id="manageBtn" aria-pressed="false">管理账号</button><p id="count">0 个账号</p></div></details>
<h1>验证码保险箱</h1><p id="status" role="status">已同步至服务器</p>
<button id="lockBtn" aria-label="锁定" title="锁定"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button></header>
<div class="vault-search"><input id="searchAccounts" type="search" placeholder="搜索..." aria-label="搜索账号" autocomplete="off"></div>
<div id="cards"></div><p id="empty">暂无账号，点右下角的「＋」添加。</p><p id="noMatches" hidden>没有找到匹配的账号。</p>
<button id="addBtn" aria-label="添加账号" title="添加账号"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12V3" stroke="#ea4335"/><path d="M12 12h9" stroke="#4285f4"/><path d="M12 12v9" stroke="#34a853"/><path d="M12 12H3" stroke="#fbbc05"/></svg></button>
</section></main><dialog id="addDialog" aria-labelledby="addTitle">
<header class="add-header"><button type="button" id="closeDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg>返回</button><h2 id="addTitle" tabindex="-1" autofocus>输入账号详情</h2></header>
<form id="addForm"><div class="add-fields">
<label for="name">账号名称</label><input id="name" maxlength="100" autocomplete="off">
<label for="secret">您的密钥</label><input id="secret" spellcheck="false" autocapitalize="off" autocomplete="off" required>
<p id="addError" role="alert"></p></div>
<button type="submit" id="saveAccount">添加</button></form>
</dialog><input type="file" id="backupFile" accept=".json,application/json" hidden><p id="toast" role="status" hidden></p><script type="module" src="app.mjs"></script></body></html>
