<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>验证码保险箱</title><link rel="stylesheet" href="style.css"></head><body><main><section id="gate"><form id="unlockForm"><input id="password" aria-label="密码" placeholder="密码" type="password" autocomplete="current-password" required maxlength="1024"><button id="unlockBtn">确定</button></form><p id="gateError" role="alert"></p></section><section id="vault" hidden><header><div class="heading"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.5 3 7.4 7.5 9.5 4.5-2.1 7.5-5 7.5-9.5V6L12 3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><div><h1>我的验证码</h1><p class="subtitle">安全保存，随时取用。</p></div></div><button id="lockBtn"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>锁定</button></header><div class="tools"><div class="summary"><p id="count">0 个账号</p><p id="status" role="status">已同步至服务器</p></div><nav aria-label="账号管理"><button id="addBtn"><span aria-hidden="true">＋</span>添加账号</button><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button></nav></div><div id="cards"></div><p id="empty">暂无账号。点击“添加账号”，输入身份验证器的设置密钥。</p><p class="note">数据加密保存在服务器，多设备可用。离开页面或闲置 5 分钟自动上锁。<br>忘记解锁密码将无法解密数据，请保留备份及密码。</p></section></main><dialog id="addDialog"><form id="addForm"><h2>添加账号</h2><p class="dialogSubtitle">把你的身份验证器添加到这里。</p><label for="name">名称</label><input id="name" maxlength="100" placeholder="例如：Google"><label for="secret">设置密钥 / otpauth 链接</label><textarea id="secret" rows="3" spellcheck="false" autocomplete="off" required></textarea><p class="note">从账号的安全设置获取密钥。添加后，在原网站输入验证码完成绑定。无需提供 Google 登录密码。</p><p id="addError" role="alert"></p><div class="actions"><button id="saveAccount">保存</button><button type="button" id="closeDialog">取消</button></div></form></dialog><input type="file" id="backupFile" accept=".json,application/json" hidden><p id="toast" role="status" hidden></p><script type="module" src="app.mjs"></script></body></html>
