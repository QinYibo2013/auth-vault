<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>验证码</title><link rel="stylesheet" href="style.css"></head><body><main><section id="gate"><form id="unlockForm"><input id="password" aria-label="密码" placeholder="密码" type="password" autocomplete="current-password" required maxlength="1024"><button id="unlockBtn">确定</button></form><p id="gateError" role="alert"></p></section><section id="vault" hidden><header><h1>验证码</h1><button id="lockBtn">锁定</button></header><nav><button id="addBtn">添加账号</button><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button></nav><p id="count">0 个账号</p><p id="status" role="status">已同步至服务器</p><div id="cards"></div><p id="empty">暂无账号。点击“添加账号”，输入身份验证器的设置密钥。</p><p class="note">数据加密保存在服务器，多设备可用。离开页面或闲置 5 分钟自动上锁。<br>忘记解锁密码将无法解密数据，请保留备份及密码。</p></section></main><dialog id="addDialog"><form id="addForm"><h2>添加账号</h2><label for="name">名称</label><input id="name" maxlength="100" placeholder="例如：Google"><label for="secret">设置密钥 / otpauth 链接</label><textarea id="secret" rows="3" spellcheck="false" autocomplete="off" required></textarea><p class="note">从账号的安全设置获取密钥。添加后，在原网站输入验证码完成绑定。无需提供 Google 登录密码。</p><p id="addError" role="alert"></p><div class="actions"><button id="saveAccount">保存</button><button type="button" id="closeDialog">取消</button></div></form></dialog><input type="file" id="backupFile" accept=".json,application/json" hidden><p id="toast" role="status" hidden></p><script type="module" src="app.mjs"></script></body></html>
